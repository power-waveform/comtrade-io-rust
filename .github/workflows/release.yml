name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # crates.io 发布不可撤销（只能 yank），用 environment 保护 + 手动 approve 防误触发
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # workspace 多 crate：必须按依赖拓扑序逐个发布，父 crate 才能从 crates.io
        # 解析到已发布的子 crate 版本。顺序 = 被依赖者先行。
        run: |
          for crate in \
            cbase cfg dat dmf inf cff dfr \
            model export edit \
            comtrade-io recognition
          do
            echo "== publish $crate =="
            cargo publish -p "$crate"
          done
