[package]
name = "comtrade-io"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "COMTRADE (IEEE C37.111) 故障录波文件解析与导出库"
license = "MIT"
authors = ["sanguine (张松贵) <82018238@qq.com>"]
repository = "https://github.com/zhangsonggui/comtrade-io-rust.git"
documentation = "https://docs.rs/comtrade-io"
homepage = "https://github.com/zhangsonggui/comtrade-io-rust"
readme = "README.md"
keywords = ["comtrade", "IEEE-C37-111", "power-system", "fault-recording"]
categories = ["parser-implementations", "science"]
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "tasks/",
    "crates/",
    "scripts/",
    "CLAUDE.md",
    "rustfmt.toml",
    ".github/",
]

[dependencies]
comtrade-cbase = { version = "0.1.0", path = "crates/cbase" }
comtrade-cfg = { version = "0.1.0", path = "crates/cfg" }
comtrade-dat = { version = "0.1.0", path = "crates/dat" }
comtrade-dmf = { version = "0.1.0", path = "crates/dmf" }
comtrade-inf = { version = "0.1.0", path = "crates/inf" }
comtrade-cff = { version = "0.1.0", path = "crates/cff" }
comtrade-dfr = { version = "0.1.0", path = "crates/dfr" }
comtrade-model = { version = "0.1.0", path = "crates/model" }
comtrade-export = { version = "0.1.0", path = "crates/export" }
comtrade-edit = { version = "0.1.0", path = "crates/edit" }

[features]
default = []
gbk-builtin = ["comtrade-cbase/gbk-builtin"]

[workspace]
members = ["crates/*"]
resolver = "2"

[package.metadata.docs.rs]
features = ["gbk-builtin"]