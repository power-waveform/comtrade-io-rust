[package]
name = "comtrade-io"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "COMTRADE (IEEE C37.111) 故障录波文件解析与导出库"
license = "MIT"
authors = ["sanguine (张松贵) <82018238@qq.com>"]
repository = "https://github.com/zhangsonggui/comtrade-io-rust.git"
documentation = "https://docs.rs/comtrade-io"
homepage = "https://github.com/zhangsonggui/comtrade-io-rust"
readme = "README.md"
keywords = ["comtrade", "IEEE-C37-111", "power-system", "fault-recording"]
categories = ["parser-implementations", "science"]
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "tasks/",
    "crates/",
    "scripts/",
    "CLAUDE.md",
    "rustfmt.toml",
    ".github/",
]

[dependencies]
cbase = { version = "0.1.0", path = "crates/cbase" }
cfg = { version = "0.1.0", path = "crates/cfg" }
dat = { version = "0.1.0", path = "crates/dat" }
dmf = { version = "0.1.0", path = "crates/dmf" }
inf = { version = "0.1.0", path = "crates/inf" }
cff = { version = "0.1.0", path = "crates/cff" }
dfr = { version = "0.1.0", path = "crates/dfr" }
model = { version = "0.1.0", path = "crates/model" }
export = { version = "0.1.0", path = "crates/export" }
edit = { version = "0.1.0", path = "crates/edit" }

[features]
default = []
gbk-builtin = ["cbase/gbk-builtin"]

[workspace]
members = ["crates/*"]
resolver = "2"

[package.metadata.docs.rs]
features = ["gbk-builtin"]