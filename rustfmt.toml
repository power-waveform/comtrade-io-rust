# rustfmt.toml — Rust 代码格式化配置
#
# 说明：本项目使用 stable 工具链（rustfmt 1.9.0-stable）。

# ========== 基础风格 ==========
edition = "2021"                    # Rust 版本，影响格式化行为
max_width = 100                     # 单行最大宽度
tab_spaces = 4                      # 缩进空格数
hard_tabs = false                   # 使用空格而非 Tab
newline_style = "Unix"              # 换行符风格：Unix / Windows / Native

# ========== 导入语句 ==========
reorder_imports = true              # 自动排序 import（stable 可用）

# ========== 函数与 impl 块 ==========
fn_params_layout = "Tall"           # 函数参数多时换行排列

# ========== 其他 ==========
use_field_init_shorthand = true     # 使用字段初始化简写：Foo { x } 而非 Foo { x: x }
use_try_shorthand = true            # 使用 try 简写：? 而非 try!()
match_block_trailing_comma = true   # match 分支末尾加逗号
