description = "COMTRADE 顶层聚合模型：Comtrade 文件组加载与写出"
license = "MIT"
authors = ["sanguine (张松贵) <82018238@qq.com>"]

[dependencies]
comtrade-cbase = { version = "0.1.0", path = "../cbase" }
